<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="二维拼贴知识视频的 Remotion 与 HyperFrames 1080p 在线演示" />
    <title>二维拼贴知识视频 · 在线演示</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">KNOWLEDGE VIDEO WORKFLOW</p>
        <h1>二维拼贴知识视频</h1>
        <p class="lead">同一份文案、旁白与组件，分别使用 Remotion 和 HyperFrames 制作。点击播放器即可直接观看 1080p 完整版本。</p>
        <div class="actions">
          <a class="repo" href="https://github.com/luu175ktovtsvor-spec/knowledge-video-workflow">查看 GitHub 仓库</a>
          <a class="repo" href="https://github.com/luu175ktovtsvor-spec/knowledge-video-workflow/archive/refs/heads/main.zip">下载完整 Skill</a>
          <a class="repo" href="https://github.com/luu175ktovtsvor-spec/knowledge-video-workflow/tree/main/assets/component-library">浏览组件库</a>
        </div>
      </header>

      <section id="remotion" class="player-card">
        <div class="title-row">
          <div>
            <p class="label">REACT / TYPESCRIPT</p>
            <h2>Remotion 版本</h2>
          </div>
          <span>1920 × 1080</span>
        </div>
        <video controls playsinline preload="metadata" poster="remotion-poster.jpg">
          <source src="videos/remotion.mp4" type="video/mp4" />
          你的浏览器不支持 HTML5 视频播放。
        </video>
      </section>

      <section id="hyperframes" class="player-card">
        <div class="title-row">
          <div>
            <p class="label">HTML / CSS / GSAP</p>
            <h2>HyperFrames 版本</h2>
          </div>
          <span>1920 × 1080</span>
        </div>
        <video controls playsinline preload="metadata" poster="hyperframes-poster.jpg">
          <source src="videos/hyperframes.mp4" type="video/mp4" />
          你的浏览器不支持 HTML5 视频播放。
        </video>
      </section>
    </main>
  </body>
</html>
