<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#fff4dc;font-family:Arial,sans-serif}
    #root,.clip{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.character{position:absolute;left:180px;top:390px;width:430px;height:470px;object-fit:contain;object-position:50% 100%}.card{position:absolute;left:700px;top:330px;padding:28px 42px;border:6px solid #2f2721;border-left:16px solid #e75d45;border-radius:20px;background:#fff4dc;font-size:52px;font-weight:900}.subtitle{position:absolute;left:100px;right:100px;bottom:65px;color:white;font-size:52px;font-weight:900;text-align:center;-webkit-text-stroke:5px #18120f;paint-order:stroke fill}
  </style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080">
  <section id="scene" class="clip" data-start="0" data-duration="8" data-track-index="1">
    <img class="bg" data-layout-allow-overflow src="assets/house-components/backgrounds/warehouse-office.png" />
    <img class="character" src="assets/house-components/characters/otter-narrator/point-up.png" />
    <div class="card">把文案变成可见动作</div><div class="subtitle">HyperFrames 二维拼贴知识视频</div>
  </section>
</div>
<script>const tl=gsap.timeline({paused:true});tl.from('#scene .character',{opacity:0,x:-70,scale:.9,duration:.55,ease:'back.out(1.4)'},.1);tl.from('#scene .card',{opacity:0,y:30,duration:.45,ease:'power3.out'},.25);tl.from('#scene .subtitle',{opacity:0,y:18,duration:.35,ease:'power2.out'},.4);window.__timelines['main']=tl;</script>
</body></html>
